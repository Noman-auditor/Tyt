name: Build NoraTunnel APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "Android project files found."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoraTunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

এই workflow "gradlew" ছাড়াই installed Gradle ব্যবহার করবে। তবে আপনার প্রজেক্টের Android Gradle Plugin-এর সঙ্গে Gradle 8.9 compatible হতে হবে।

ধাপ ২: Build চালান

1. ফাইলটি Commit করুন।
2. "GitHub Actions" (https://github.com/Noman-auditor/Tyt/actions) খুলুন।
3. নতুন "Build NoraTunnel APK" run-এর ফলাফল দেখুন।
4. সফল হলে "NoraTunnel-debug-apk" artifact থেকে APK সংগ্রহ করুন।

মনে রাখবেন: APK build সফল হওয়া মানেই VPN-এর সব protocol বাস্তবে কাজ করছে—এমন নয়।

পরবর্তী run-এ যদি error আসে, "What went wrong" অংশটি পাঠান। তখন Gradle, plugin version বা Kotlin compilation-এর আসল সমস্যাটি ঠিক করব।
